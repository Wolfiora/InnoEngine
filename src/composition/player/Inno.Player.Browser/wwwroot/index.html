<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inno Player</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #121318; color: #ededf0; font: 15px system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: fixed; left: 16px; bottom: 16px; padding: 10px 14px; border-radius: 8px; background: #1e2028d9; pointer-events: none; }
    #status:empty { display: none; }
    #error { position: fixed; inset: 0; display: none; overflow: auto; padding: 24px; box-sizing: border-box; background: #121318; white-space: pre-wrap; }
  </style>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Game canvas"></canvas>
  <div id="status" role="status">Loading game…</div>
  <div id="error" role="alert"></div>
</body>
</html>
