name: Engine CI

on:
  workflow_dispatch:
    inputs:
      native_product_acceptance:
        description: Run native products with the selected BGCS toolchain
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/rendering-ci.yml"
      - "build/**"
      - "extern/**"
      - "entry/**"
      - "backends/**"
      - "platforms/**"
      - "src/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".gitmodules"
      - "Directory.Build.props"
      - "global.json"
      - "Directory.Build.targets"
      - "Directory.Solution.props"
      - "Directory.Solution.targets"
      - "InnoEngine.sln"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/rendering-ci.yml"
      - "build/**"
      - "extern/**"
      - "entry/**"
      - "backends/**"
      - "platforms/**"
      - "src/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
      - ".gitmodules"
      - "Directory.Build.props"
      - "global.json"
      - "Directory.Build.targets"
      - "Directory.Solution.props"
      - "Directory.Solution.targets"
      - "InnoEngine.sln"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  managed:
    name: Managed / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test the independent managed graph
        shell: pwsh
        run: |
          ./tests/Invoke-NuGetLockChecks.ps1 -ResultsDirectory artifacts/acceptance/managed/nuget-before
          ./tests/Invoke-ManagedChecks.ps1
          ./tests/Invoke-NuGetLockChecks.ps1 -ResultsDirectory artifacts/acceptance/managed/nuget-after
      - name: Upload managed results and deferred dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-${{ matrix.os }}
          path: artifacts/acceptance/managed/**
          if-no-files-found: error

  rendering:
    if: github.event_name != 'workflow_dispatch' || inputs.native_product_acceptance
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            build_target: windows-x64
            runtime_identifier: win-x64
            architecture: X64
            backend_pattern: "Rendering initialized with Direct3D(11|12)"
            product_properties: platforms/WindowsX64/build/Inno.Build.WindowsX64/EditorProduct.props
            player_project: platforms/WindowsX64/player/Inno.Player.WindowsX64/Inno.Player.WindowsX64.csproj
          - os: macos-15
            platform: osx-arm64
            build_target: macos-arm64
            runtime_identifier: osx-arm64
            architecture: Arm64
            backend_pattern: "Rendering initialized with Metal"
            product_properties: platforms/MacOSArm64/build/Inno.Build.MacOSArm64/EditorProduct.props
            player_project: platforms/MacOSArm64/player/Inno.Player.MacOSArm64/Inno.Player.MacOSArm64.csproj

    steps:
      - name: Checkout repository and native dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/inno-dotnet
        with:
          global-json-file: global.json

      - name: Install MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Verify runner architecture
        shell: pwsh
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($actual -ne '${{ matrix.architecture }}') {
            throw "Runner architecture '$actual' does not match required '${{ matrix.architecture }}'."
          }

      - name: Record selected SDK and compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'artifacts/acceptance/ci-build' | Out-Null
          dotnet --info | Set-Content 'artifacts/acceptance/ci-build/dotnet-info.txt'
          $selection = @(dotnet msbuild 'build/bindings/Inno.Build.Bindings/Inno.Build.Bindings.csproj' `
            -nologo -m:1 -nr:false -p:DesignTimeBuild=true `
            -getProperty:RoslynTargetsPath,NETCoreSdkVersion,LangVersion,MSBuildVersion)
          if ($LASTEXITCODE -ne 0) { throw 'SDK and compiler inspection failed.' }
          $selection | Set-Content 'artifacts/acceptance/ci-build/compiler-selection.json'
          $compiler = (($selection -join [Environment]::NewLine) | ConvertFrom-Json).Properties.RoslynTargetsPath
          dotnet (Join-Path $compiler 'bincore/csc.dll') -version |
            Set-Content 'artifacts/acceptance/ci-build/compiler-version.txt'
          if ($LASTEXITCODE -ne 0) { throw 'The selected compiler could not report its version.' }

      - name: Build host Editor in Debug and Release
        shell: pwsh
        run: |
          ./tests/Invoke-NuGetLockChecks.ps1 -Project entry/InnoEngine.Editor/InnoEngine.Editor.csproj -Configuration Debug `
            -ResultsDirectory artifacts/acceptance/ci-build/nuget-editor-debug
          ./tests/Invoke-NuGetLockChecks.ps1 -Project entry/InnoEngine.Editor/InnoEngine.Editor.csproj -Configuration Release `
            -ResultsDirectory artifacts/acceptance/ci-build/nuget-editor-release
          ./tests/Invoke-NuGetLockChecks.ps1 -Project '${{ matrix.player_project }}' -Configuration Release `
            -RuntimeIdentifier '${{ matrix.runtime_identifier }}' -PublishAot `
            -ResultsDirectory artifacts/acceptance/ci-build/nuget-player-aot
          dotnet build "entry/InnoEngine.Build/InnoEngine.Build.csproj" --disable-build-servers -m:1 -nr:false `
            -p:UseSharedCompilation=false '-bl:artifacts/acceptance/ci-build/entry.binlog' 2>&1 |
            Tee-Object -FilePath 'artifacts/acceptance/ci-build/entry.log'
          if ($LASTEXITCODE -ne 0) { throw "Build entry preparation failed." }
          dotnet run --project "entry/InnoEngine.Build/InnoEngine.Build.csproj" --no-build -- editor --configuration Debug 2>&1 |
            Tee-Object -FilePath 'artifacts/acceptance/ci-build/editor-debug.log'
          if ($LASTEXITCODE -ne 0) { throw "Debug host Editor build failed." }
          dotnet run --project "entry/InnoEngine.Build/InnoEngine.Build.csproj" --no-build -- editor --configuration Release 2>&1 |
            Tee-Object -FilePath 'artifacts/acceptance/ci-build/editor-release.log'
          if ($LASTEXITCODE -ne 0) { throw "Release host Editor build failed." }

      - name: Verify restored BGCS package and repeated cache reuse
        shell: pwsh
        run: |
          $assets = @(dotnet msbuild 'build/bindings/Inno.Build.Bindings/Inno.Build.Bindings.csproj' `
            -nologo -m:1 -nr:false -getProperty:ProjectAssetsFile,InnoBgcsPackageVersion)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve BGCS restore ownership.' }
          $evaluation = ($assets -join [Environment]::NewLine) | ConvertFrom-Json
          $expectedVersion = $evaluation.Properties.InnoBgcsPackageVersion
          $restored = Get-Content -LiteralPath $evaluation.Properties.ProjectAssetsFile -Raw | ConvertFrom-Json
          $packages = @($restored.libraries.PSObject.Properties.Name | Where-Object { $_ -match '^BGCS(?:\.[^/]+)?/' })
          if ($packages.Count -eq 0 -or @($packages | Where-Object { ($_ -split '/')[-1] -ne $expectedVersion }).Count -ne 0) {
            throw ('Every restored BGCS package must use exactly '+$expectedVersion+'.')
          }
          $packages | Set-Content 'artifacts/acceptance/ci-build/bgcs-packages.txt'
          ./tests/Invoke-BuildCacheChecks.ps1 -ResultsDirectory 'artifacts/acceptance/ci-build/cache'

      - name: Build managed solution
        shell: pwsh
        run: |
          dotnet build InnoEngine.sln --configuration SourceDebug --disable-build-servers -m:1 -nr:false `
            -p:UseSharedCompilation=false '-bl:artifacts/acceptance/ci-build/source-debug.binlog' 2>&1 |
            Tee-Object -FilePath 'artifacts/acceptance/ci-build/source-debug.log'
          if ($LASTEXITCODE -ne 0) { throw 'SourceDebug build failed.' }

      - name: Enforce source and compiled public API architecture boundaries
        shell: pwsh
        run: dotnet run --project "entry/InnoEngine.Build/InnoEngine.Build.csproj" --no-build -- verify .

      - name: Run complete test suite
        shell: pwsh
        run: |
          $properties = Join-Path $PWD '${{ matrix.product_properties }}'
          New-Item -ItemType Directory -Force 'artifacts/acceptance/ci-tests' | Out-Null
          dotnet --info | Set-Content 'artifacts/acceptance/ci-tests/dotnet-info.txt'
          dotnet msbuild 'build/bindings/Inno.Build.Bindings/Inno.Build.Bindings.csproj' `
            -nologo -m:1 -nr:false -p:DesignTimeBuild=true -p:UseSharedCompilation=false `
            -p:InnoNativeTarget='${{ matrix.build_target }}' `
            -getProperty:MSBuildRuntimeType,MSBuildRuntimeVersion,NETCoreSdkVersion,CscToolPath,CscToolExe,UseSharedCompilation,NETCoreSdkRuntimeIdentifier `
            | Set-Content 'artifacts/acceptance/ci-tests/compiler-selection.json'
          if ($LASTEXITCODE -ne 0) { throw "Compiler selection inspection failed." }
          dotnet build InnoEngine.sln --configuration SourceDebug --disable-build-servers -m:1 -nr:false `
            -p:UseSharedCompilation=false `
            -p:InnoNativeTarget='${{ matrix.build_target }}' -p:InnoToolTarget='${{ matrix.build_target }}' `
            -p:InnoProductBuildProperties=$properties -p:InnoTestNativeProduct=editor -p:InnoTestNativeTarget='${{ matrix.build_target }}' `
            '-bl:artifacts/acceptance/ci-tests/target-build.binlog' 2>&1 |
            Tee-Object -FilePath 'artifacts/acceptance/ci-tests/target-build.log'
          if ($LASTEXITCODE -ne 0) { throw "Target test closure compilation failed." }
          ./tests/Invoke-IsolatedTests.ps1 -Configuration SourceDebug -Target '${{ matrix.build_target }}' -ProductProperties $properties

      - name: Generate source-independent Player Support Pack
        shell: pwsh
        run: |
          $supportPacks = Join-Path $env:RUNNER_TEMP "InnoSupportPacks"
          dotnet run --project "entry/InnoEngine.Build/InnoEngine.Build.csproj" --no-build -- support-pack `
            --engine-root $PWD `
            --output $supportPacks `
            --target '${{ matrix.build_target }}' `
            --tools-target '${{ matrix.build_target }}' `
            --dotnet (Get-Command dotnet).Source
          $expectedMiniAudio = if ($IsWindows) { "miniaudio-release.dll" } else { "libminiaudio-release.dylib" }
          $targetRoot = Join-Path $supportPacks '${{ matrix.build_target }}'
          $fingerprint = (Get-Content -LiteralPath (Join-Path $targetRoot 'current') -Raw).Trim()
          if ($fingerprint -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The Support Pack selection has no valid content identity.'
          }
          $selectedPack = Join-Path $targetRoot $fingerprint
          $runtimeFiles = @(Get-ChildItem -LiteralPath (Join-Path $selectedPack 'native') -Recurse -File -Filter $expectedMiniAudio)
          $linkFiles = @(Get-ChildItem -LiteralPath (Join-Path $selectedPack 'PlayerLink/native') -Recurse -File -Filter $expectedMiniAudio)
          if ($runtimeFiles.Count -ne 1 -or $linkFiles.Count -ne 1) {
            throw "Expected one '$expectedMiniAudio' in each selected runtime and PlayerLink closure."
          }
          if ((Get-FileHash -LiteralPath $runtimeFiles[0].FullName).Hash -cne (Get-FileHash -LiteralPath $linkFiles[0].FullName).Hash) {
            throw 'The runtime and PlayerLink Native inputs do not match.'
          }

      - name: Validate current Wiki signatures and compiled examples
        shell: pwsh
        run: |
          dotnet build '${{ matrix.player_project }}' --configuration Debug --disable-build-servers -m:1 -nr:false `
            '-bl:artifacts/acceptance/ci-build/wiki-player.binlog' 2>&1 |
            Tee-Object -FilePath 'artifacts/acceptance/ci-build/wiki-player.log'
          if ($LASTEXITCODE -ne 0) { throw 'The current Wiki target reference closure could not be built.' }
          $project = Join-Path $env:RUNNER_TEMP 'InnoWikiProject'
          New-Item -ItemType Directory -Force (Join-Path $project 'Assets') | Out-Null
          'public sealed class WikiProbe { }' | Set-Content (Join-Path $project 'Assets/WikiProbe.cs') -Encoding utf8
          ./tests/Invoke-WikiChecks.ps1 -ProjectDirectory $project -Target '${{ matrix.build_target }}'

      - name: Run real renderer smoke
        shell: pwsh
        run: |
          $smokeProject = Join-Path $env:RUNNER_TEMP "InnoRenderingSmoke"
          New-Item -ItemType Directory -Force (Join-Path $smokeProject "Assets") | Out-Null
          $nativeLog = Join-Path $smokeProject "Logs/NativeRendering.log"
          New-Item -ItemType Directory -Force (Split-Path $nativeLog) | Out-Null
          $editor = @(dotnet msbuild 'entry/InnoEngine.Editor/InnoEngine.Editor.csproj' `
            -nologo -m:1 -nr:false -p:Configuration=Debug -getProperty:TargetPath)
          if ($LASTEXITCODE -ne 0 -or $editor.Count -ne 1 -or -not (Test-Path -LiteralPath $editor[0])) {
            throw 'The built Editor entry is unavailable at its evaluated TargetPath.'
          }
          dotnet $editor[0] `
            $smokeProject --smoke-frames 3 2>&1 | Tee-Object -FilePath $nativeLog
          if ($LASTEXITCODE -ne 0) {
            throw "Renderer smoke exited with code $LASTEXITCODE."
          }

          $bootLog = Join-Path $smokeProject "Logs/EditorBoot.log"
          if (-not (Test-Path $bootLog)) {
            throw "Renderer smoke did not produce EditorBoot.log."
          }
          $boot = Get-Content -Raw $bootLog
          if ($boot -notmatch '${{ matrix.backend_pattern }}') {
            throw "Renderer smoke did not initialize the required backend pattern '${{ matrix.backend_pattern }}'."
          }
          if ($boot -notmatch 'Smoke frame limit reached after 3 frame\(s\)\.') {
            throw "Renderer smoke did not submit the required frame count."
          }
          if ($boot -notmatch 'Dispose end\.') {
            throw "Renderer smoke did not complete orderly shutdown."
          }
          if ($boot -match 'Teardown failure') {
            throw "Renderer smoke reported a teardown failure."
          }

          $native = Get-Content -Raw $nativeLog
          if ($boot -notmatch 'Primary presentation encodes sRGB: True\.') {
            throw "Renderer smoke did not enable the sRGB backbuffer contract."
          }
          if ($native -match 'BGFX FATAL') {
            throw "Renderer smoke reported a BGFX fatal diagnostic."
          }

      - name: Upload renderer smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-smoke-${{ matrix.platform }}
          path: ${{ runner.temp }}/InnoRenderingSmoke/Logs/**
          if-no-files-found: warn

      - name: Upload contract and Wiki evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-${{ matrix.build_target }}
          path: |
            artifacts/acceptance/ci-tests/**
            artifacts/acceptance/ci-build/**
            artifacts/acceptance/wiki-gate/**
          if-no-files-found: warn

      - name: Upload Player E2E output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-e2e-${{ matrix.build_target }}
          path: ${{ runner.temp }}/InnoPlayerE2E/**
          if-no-files-found: warn
