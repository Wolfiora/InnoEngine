name: Engine CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 19 * * *' # 03:17 Asia/Taipei; Sunday is owned by the weekly run.
    - cron: '17 20 * * 6' # Sunday 04:17 Asia/Taipei.
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete supported functional matrix
        type: boolean
        default: true
      extended:
        description: Require cold native input, ten warm samples and extended lifecycle acceptance
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: engine-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  cadence:
    name: Select validation cadence
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      full: ${{ steps.select.outputs.full }}
      extended: ${{ steps.select.outputs.extended }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          ./tests/ci/Get-ValidationCadence.ps1 -EventPath $env:GITHUB_EVENT_PATH -Event $env:GITHUB_EVENT_NAME `
            -Commit $env:CANDIDATE_COMMIT -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL

  validation:
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    name: Validate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
        id: sdk
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: runner.os == 'Windows'
      - name: Prepare one plan on the actual merge candidate
        id: plan
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          EXPECTED_COMMIT: ${{ github.sha }}
          FORCE_FULL: ${{ needs.cadence.outputs.full }}
          EXTENDED: ${{ needs.cadence.outputs.extended }}
          VALIDATION_PLATFORM: ${{ matrix.os }}
        run: |
          $baseline = $env:BASE_REVISION
          if ($baseline -match '^0+$') { $baseline = $env:EXPECTED_COMMIT; $env:FORCE_FULL = 'true' }
          ./tests/ci/Invoke-ValidationCi.ps1 -Stage Plan -BaseRevision $baseline -ExpectedCommit $env:EXPECTED_COMMIT `
            -Full:($env:FORCE_FULL -eq 'true') -Extended:($env:EXTENDED -eq 'true')
      - name: Restore immutable candidates for publisher verification
        id: native-cache
        if: steps.plan.outputs.native == 'true' && needs.cadence.outputs.extended != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: inno-immutable-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.dotnet-version }}-lookup-${{ github.run_id }}
          restore-keys: inno-immutable-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.dotnet-version }}-
          path: artifacts/validation/native-cache.zip
      - name: Execute and reconcile the frozen plan
        id: execute
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          FORCE_FULL: ${{ needs.cadence.outputs.full }}
          EXTENDED: ${{ needs.cadence.outputs.extended }}
          VALIDATION_PLATFORM: ${{ matrix.os }}
        run: |
          ./tests/ci/Invoke-ValidationCi.ps1 -Stage Run -BaseRevision $env:EXPECTED_COMMIT -ExpectedCommit $env:EXPECTED_COMMIT `
            -Full:($env:FORCE_FULL -eq 'true') -Extended:($env:EXTENDED -eq 'true')
      - name: Save only complete immutable generations from trusted default-branch validation
        if: github.ref_name == github.event.repository.default_branch && steps.plan.outputs.native == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: inno-immutable-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.dotnet-version }}-${{ hashFiles('artifacts/validation/native-cache.zip') }}
          path: artifacts/validation/native-cache.zip
      - name: Retain verified deliverables without rebuilding
        if: steps.execute.outputs.deliverables != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deliverable-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.execute.outputs.deliverables }}/
          if-no-files-found: error
          retention-days: 90
      - name: Retain the first failure, complete plan, logs and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: artifacts/validation/ci/
          if-no-files-found: error
          retention-days: 30

  engine-validation:
    name: Engine validation
    if: always()
    needs: [cadence, validation]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.cadence.outputs.run == 'true'
        with:
          pattern: validation-*
          path: artifacts/validation/received
      - name: Reconcile every required platform and planned result
        id: reconcile
        shell: pwsh
        env:
          PRODUCER_CONCLUSION: ${{ needs.validation.result }}
          EXPECTED_COMMIT: ${{ github.sha }}
          CADENCE_CONCLUSION: ${{ needs.cadence.result }}
          SHOULD_RUN: ${{ needs.cadence.outputs.run }}
        run: |
          if ($env:CADENCE_CONCLUSION -cne 'success') { throw 'Cadence selection did not succeed.' }
          if ($env:SHOULD_RUN -ceq 'false') {
            if ($env:GITHUB_EVENT_NAME -cne 'schedule') { throw 'Candidate validation cannot be skipped.' }
            exit 0
          }
          if ($env:SHOULD_RUN -cne 'true') { throw 'Cadence selection did not produce an explicit decision.' }
          $receipts = foreach ($platform in @('windows-2022', 'macos-15')) {
            $available = @(Get-ChildItem artifacts/validation/received -Directory | ForEach-Object { [pscustomobject]@{ name = $_.Name; directory = $_.FullName } })
            $selected = ./tests/ci/Select-ValidationArtifact.ps1 -Artifacts $available -Name "validation-$platform" -MaximumAttempt ([int]$env:GITHUB_RUN_ATTEMPT)
            $directory = $selected.directory
            $receipt = ./tests/ci/Test-ValidationReport.ps1 -PlanPath "$directory/plan.json" -ResultsPath "$directory/results.json" `
              -ExpectedCommit $env:EXPECTED_COMMIT -JobConclusion $env:PRODUCER_CONCLUSION
            [pscustomobject]@{ platform = $platform; receipt = $receipt }
          }
          $receipts | ConvertTo-Json -Depth 10 | Set-Content artifacts/validation/certification.json
          $full = @($receipts | Where-Object { -not $_.receipt.full }).Count -eq 0
          "full=$($full.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          foreach ($receipt in $receipts) {
            "$($receipt.platform): $($receipt.receipt.passed) passed, $($receipt.receipt.reused) reused, $($receipt.receipt.notApplicable) explicitly not applicable." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Summarize failures and comparable duration changes
        if: always() && needs.cadence.outputs.run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./tests/ci/Write-ValidationSummary.ps1 -ReceivedDirectory artifacts/validation/received -Repository $env:GITHUB_REPOSITORY `
            -DefaultBranch $env:DEFAULT_BRANCH -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) -RunId ([long]$env:GITHUB_RUN_ID) -ApiUrl $env:GITHUB_API_URL
      - name: Retain reconciled certification
        if: needs.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-certification-attempt-${{ github.run_attempt }}
          path: artifacts/validation/certification.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain complete functional certification
        if: steps.reconcile.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-full-certification-attempt-${{ github.run_attempt }}
          path: artifacts/validation/certification.json
          if-no-files-found: error
          retention-days: 30
