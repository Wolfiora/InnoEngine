name: Engine CI
run-name: Engine validation ${{ github.sha }}

on:
  pull_request:
  push:
    branches: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      rebuild_backends:
        description: Optional comma-separated platform IDs for a cold rebuild on this manual run
        type: string
      full:
        description: Run complete functional acceptance
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: engine-validation-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      profile: ${{ steps.select.outputs.profile }}
      hosts: ${{ steps.select.outputs.hosts }}
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: select
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
        run: |
          $selected = ./tools/ci/Get-ValidationCadence.ps1 -EventPath $env:GITHUB_EVENT_PATH -Event $env:GITHUB_EVENT_NAME `
            -Commit $env:CANDIDATE -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL | ConvertFrom-Json
          $hosts = @(Get-Content .github/validation-hosts.json -Raw | ConvertFrom-Json | Where-Object { $selected.profile -cne 'fast' -or $_.fast })
          if ($hosts.Count -eq 0 -or @($hosts.runner | Sort-Object -Unique).Count -ne $hosts.Count) { throw 'Hosted execution registration is empty or duplicated.' }
          # Recheck an ordinary push immediately before scheduling expensive jobs; PR event delivery can race the first lookup.
          if ($env:GITHUB_EVENT_NAME -ceq 'push' -and $selected.profile -ceq 'fast' -and $selected.run) {
            $selected = ./tools/ci/Get-ValidationCadence.ps1 -EventPath $env:GITHUB_EVENT_PATH -Event $env:GITHUB_EVENT_NAME `
              -Commit $env:CANDIDATE -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL | ConvertFrom-Json
          }
          $targets = @(Get-Content .github/native-targets.json -Raw | ConvertFrom-Json)
          $requested = @($env:REBUILD_TARGETS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if (@($requested | Where-Object { $_ -cnotin $targets.target }).Count -or @($requested | Sort-Object -Unique).Count -ne $requested.Count) {
            throw 'Unknown or duplicate manual backend target.'
          }
          # Only the first complete backend catalog requires a cross-host publication.
          $bootstrap = $false
          if ($selected.run -and $hosts.Count -gt 1) {
            for ($page = 1; ; $page++) {
              $releases = @(Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page" | Write-Output)
              if (@($releases | Where-Object { $_.prerelease -and !$_.draft -and $_.tag_name -cmatch '^backend-prebuilts-[0-9.]+$' }).Count) { break }
              if ($releases.Count -lt 100) { $bootstrap = $true; break }
            }
          }
          $groups = if ($bootstrap) {
            @{name='Initial catalog';hosts=@{include=$hosts};rebuild=($requested -join ',')}
          } else {
            foreach ($hostSpec in $hosts) {
              $ids = @($targets | Where-Object runner -CEQ $hostSpec.runner | ForEach-Object target)
              @{name=$hostSpec.runner;hosts=@{include=@($hostSpec)};rebuild=(@($requested | Where-Object { $_ -cin $ids }) -join ',')}
            }
          }
          "groups=$(@{include=@($groups)} | ConvertTo-Json -Depth 8 -Compress)" >> $env:GITHUB_OUTPUT
          "run=$($selected.run.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "profile=$($selected.profile)" >> $env:GITHUB_OUTPUT
          "hosts=$(@{ include = $hosts } | ConvertTo-Json -Depth 4 -Compress)" >> $env:GITHUB_OUTPUT

  platforms:
    needs: route
    if: needs.route.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.groups) }}
    permissions:
      contents: write
      actions: read
    name: ${{ matrix.name }}
    uses: ./.github/workflows/engine-platform.yml
    with:
      hosts: ${{ toJSON(matrix.hosts) }}
      profile: ${{ needs.route.outputs.profile }}
      rebuild_backends: ${{ matrix.rebuild }}

  engine-validation:
    # Branch routing must never publish success under the pull-request merge gate's name.
    name: ${{ github.event_name == 'push' && github.ref_name != github.event.repository.default_branch && 'Branch validation' || 'Engine validation' }}
    # Reconcile failed prerequisites on a live run. A cancelled run has no candidate to certify.
    if: ${{ !cancelled() }}
    needs: [route, platforms]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.route.outputs.run == 'true'
        with:
          pattern: validation-{plan,joined,result}-*
          path: artifacts/validation/received
      - name: Reconcile the exact required host and shard matrix
        shell: pwsh
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          PLATFORM_RESULT: ${{ needs.platforms.result }}
          SHOULD_RUN: ${{ needs.route.outputs.run }}
          HOSTS: ${{ needs.route.outputs.hosts }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: ./tools/ci/Invoke-ValidationGate.ps1
      - name: Retain first failures and timing by check category
        if: ${{ !cancelled() && needs.route.outputs.run == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTS: ${{ needs.route.outputs.hosts }}
        run: |
          ./tools/ci/Write-ValidationSummary.ps1 -ReceivedDirectory artifacts/validation/received -Repository $env:GITHUB_REPOSITORY `
            -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) -RunId ([long]$env:GITHUB_RUN_ID) -ApiUrl $env:GITHUB_API_URL `
            -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner)
