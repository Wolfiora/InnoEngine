name: Engine CI
run-name: Engine validation ${{ inputs.request_id || github.sha }}

on:
  pull_request:
  push:
    branches: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional release completion correlation
        type: string
      source_run:
        description: Successful default-branch run whose missing functional checks should be completed
        type: string
        default: '0'
      rebuild_backends:
        description: Optional comma-separated platform IDs for a cold rebuild during full acceptance
        type: string
      full:
        description: Run complete functional acceptance
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: engine-validation-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      profile: ${{ steps.select.outputs.profile }}
      hosts: ${{ steps.select.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: select
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
          SOURCE_RUN_ID: ${{ inputs.source_run }}
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $selected = ./tools/ci/Get-ValidationCadence.ps1 -EventPath $env:GITHUB_EVENT_PATH -Event $env:GITHUB_EVENT_NAME `
            -Commit $env:CANDIDATE -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL | ConvertFrom-Json
          if ($env:REBUILD_TARGETS -and ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $selected.profile -cne 'full')) {
            throw 'Explicit backend rebuilds require a manual full acceptance run.'
          }
          if ($env:SOURCE_RUN_ID -and $env:SOURCE_RUN_ID -cne '0') {
            $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            if ($env:GITHUB_REF_NAME -cne $event.repository.default_branch -or $selected.profile -cne 'full' -or
                $env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Continuation requires a full default-branch candidate and an exact source run.' }
          }
          $hosts = @(Get-Content .github/validation-hosts.json -Raw | ConvertFrom-Json | Where-Object { $selected.profile -cne 'fast' -or $_.fast })
          if ($hosts.Count -eq 0 -or @($hosts.runner | Sort-Object -Unique).Count -ne $hosts.Count) { throw 'Hosted execution registration is empty or duplicated.' }
          if ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch' -and $selected.profile -ceq 'pull-request') {
            $env:BASELINE = (& git rev-parse HEAD^).Trim()
            if ($LASTEXITCODE) { throw 'Manual affected validation requires the candidate parent.' }
          }
          if ($selected.run -and $selected.profile -ceq 'pull-request' -and $env:BASELINE) {
            $hosts = @(./tools/ci/Select-ValidationHosts.ps1 -Hosts $hosts -Baseline $env:BASELINE -Candidate $env:CANDIDATE -DefaultBranch $env:DEFAULT_BRANCH)
          }
          # Recheck an ordinary push immediately before scheduling expensive jobs; PR event delivery can race the first lookup.
          if ($env:GITHUB_EVENT_NAME -ceq 'push' -and $selected.profile -ceq 'fast' -and $selected.run) {
            $selected = ./tools/ci/Get-ValidationCadence.ps1 -EventPath $env:GITHUB_EVENT_PATH -Event $env:GITHUB_EVENT_NAME `
              -Commit $env:CANDIDATE -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL | ConvertFrom-Json
          }
          "run=$($selected.run.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "profile=$($selected.profile)" >> $env:GITHUB_OUTPUT
          "hosts=$(@{ include = $hosts } | ConvertTo-Json -Depth 4 -Compress)" >> $env:GITHUB_OUTPUT

  plan:
    outputs:
      # A host that finished its own plan emits no job-level demand. The runner
      # omits empty outputs, so matrix completion order cannot erase another host's request.
      dispatch: ${{ steps.decision.outputs.dispatch == 'true' && 'true' || '' }}
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/freeze-validation
        with:
          runner-label: ${{ matrix.runner }}
          profile: ${{ needs.route.outputs.profile }}
      - uses: ./.github/actions/resolve-backends
      - id: decision
        shell: pwsh
        env:
          MULTI_HOST: ${{ fromJSON(needs.route.outputs.hosts).include[1] != null }}
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
        run: |
          $decision = Get-Content artifacts/backend-request/acquisition.json -Raw | ConvertFrom-Json
          $direct = !$env:REBUILD_TARGETS -and $decision.packages.Count -eq 1 -and $decision.packages[0].operation -ceq 'consume'
          if ($direct) {
            $digest = $decision.packages[0].sha256
            if ($digest -cnotmatch '^[a-f0-9]{64}$') { throw 'Direct backend consumption requires an exact archive digest.' }
            "digest=$digest" >> $env:GITHUB_OUTPUT
          }
          $entry = (Get-Content artifacts/validation/ci-plan/entry.json -Raw | ConvertFrom-Json).assembly
          "entry-directory=$((Split-Path $entry).Replace('\','/'))" >> $env:GITHUB_OUTPUT
          $deferred = $decision.packages.Count -gt 0 -and !$direct
          $inline = !$env:REBUILD_TARGETS -and !$deferred -and ($env:MULTI_HOST -ine 'true' -or ($decision.portableTestChanges -and !$decision.packages.Count))
          $decision | Add-Member -NotePropertyName executedLocally -NotePropertyValue $inline
          $decision | Add-Member -NotePropertyName deferred -NotePropertyValue $deferred
          [IO.File]::WriteAllText([IO.Path]::GetFullPath('artifacts/backend-request/acquisition.json'), (ConvertTo-Json $decision -Depth 30 -Compress))
          "dispatch=$((!$inline).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: fromJSON(needs.route.outputs.hosts).include[1] != null || steps.decision.outputs.dispatch == 'true'
        with:
          overwrite: true
          name: backend-request-${{ matrix.runner }}
          path: artifacts/backend-request/acquisition.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.decision.outputs.dispatch == 'true'
        with:
          name: scheduled-plan-${{ matrix.runner }}
          path: |
            artifacts/validation/ci-plan/plan.json
            artifacts/validation/ci-plan/entry.json
            ${{ steps.decision.outputs.entry-directory }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: ./.github/actions/consume-validation
        if: steps.decision.outputs.dispatch == 'false'
        with:
          digest: ${{ steps.decision.outputs.digest }}
          platform: ${{ matrix.runner }}
          source-run: ${{ inputs.source_run || '0' }}

  backend-matrix:
    needs: [route, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.dispatch == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      chains: ${{ steps.join.outputs.chains }}
      reader_tags: ${{ steps.join.outputs.reader_tags }}
      independent: ${{ steps.join.outputs.independent }}
      required: ${{ steps.join.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: backend-request-*
          path: ${{ fromJSON(needs.route.outputs.hosts).include[1] == null && format('artifacts/requests/backend-request-{0}', fromJSON(needs.route.outputs.hosts).include[0].runner) || 'artifacts/requests' }}
      - id: join
        shell: pwsh
        env:
          HOSTS: ${{ needs.route.outputs.hosts }}
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
        run: |
          $jobs = ./tools/ci/Join-BackendAcquisitions.ps1 -RebuildTargets $env:REBUILD_TARGETS -Received artifacts/requests -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner) `
            -Revision $env:GITHUB_SHA
          foreach ($name in 'chains','independent') {
            "$name=$(@{include=@($jobs.$name)} | ConvertTo-Json -Compress -Depth 8)" >> $env:GITHUB_OUTPUT
          }
          "reader_tags=$(ConvertTo-Json -InputObject $jobs.readerTags -Compress)" >> $env:GITHUB_OUTPUT
          "required=$(($jobs.platforms.Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  independent:
    needs: [route, backend-matrix]
    if: ${{ !cancelled() && needs.backend-matrix.result == 'success' && fromJSON(needs.backend-matrix.outputs.independent).include[0] != null }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.backend-matrix.outputs.independent) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/freeze-validation
        with:
          runner-label: ${{ matrix.runner }}
          profile: ${{ needs.route.outputs.profile }}
          scheduled: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-request-${{ matrix.runner }}
          path: artifacts/backend-request
      - uses: ./.github/actions/consume-validation
        with:
          digest: ${{ matrix.digest }}
          platform: ${{ matrix.runner }}
          source-run: ${{ inputs.source_run || '0' }}

  backends:
    needs: [backend-matrix, route]
    if: ${{ !cancelled() && needs.backend-matrix.result == 'success' && needs.backend-matrix.outputs.required == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.backend-matrix.outputs.chains) }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/backend-prebuilts.yml
    with:
      platforms: ${{ toJSON(matrix.platforms) }}
      producers: ${{ toJSON(matrix.producers) }}
      consumers: ${{ toJSON(matrix.consumers) }}
      reader_tags: ${{ needs.backend-matrix.outputs.reader_tags }}
      profile: ${{ needs.route.outputs.profile }}
      source_run: ${{ inputs.source_run || '0' }}
      rebuild_backends: ${{ inputs.rebuild_backends || '' }}

  engine-validation:
    # Branch routing must never publish success under the pull-request merge gate's name.
    name: ${{ github.event_name == 'push' && github.ref_name != github.event.repository.default_branch && 'Branch validation' || 'Engine validation' }}
    # Reconcile failed prerequisites on a live run. A cancelled run has no candidate to certify.
    if: ${{ !cancelled() }}
    needs: [route, plan, backend-matrix, backends, independent]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.route.outputs.run == 'true'
        with:
          # The gate consumes receipts; compiled archives belong to release continuation.
          pattern: validation-{plan,joined,result}-*
          path: artifacts/validation/received
      - name: Reconcile the exact required host and shard matrix
        shell: pwsh
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX_RESULT: ${{ needs.backend-matrix.result }}
          DISPATCH: ${{ needs.plan.outputs.dispatch }}
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          BACKENDS_REQUIRED: ${{ needs.backend-matrix.outputs.required }}
          INDEPENDENT_RESULT: ${{ needs.independent.result }}
          INDEPENDENT: ${{ needs.backend-matrix.outputs.independent }}
          SHOULD_RUN: ${{ needs.route.outputs.run }}
          HOSTS: ${{ needs.route.outputs.hosts }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: ./tools/ci/Invoke-ValidationGate.ps1
      - name: Retain first failures and timing by check category
        if: ${{ !cancelled() && needs.route.outputs.run == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HOSTS: ${{ needs.route.outputs.hosts }}
        run: |
          ./tools/ci/Write-ValidationSummary.ps1 -ReceivedDirectory artifacts/validation/received -Repository $env:GITHUB_REPOSITORY `
            -DefaultBranch $env:DEFAULT_BRANCH -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) -RunId ([long]$env:GITHUB_RUN_ID) -ApiUrl $env:GITHUB_API_URL `
            -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.route.outputs.run == 'true'
        with:
          name: engine-certification-attempt-${{ github.run_attempt }}
          path: artifacts/validation/certification.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: env.INNO_FULL_CERTIFICATION == 'true'
        with:
          name: engine-full-certification-attempt-${{ github.run_attempt }}
          path: artifacts/validation/certification.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.route.outputs.run == 'true'
        with:
          name: engine-acceptance-evidence-attempt-${{ github.run_attempt }}
          path: artifacts/validation/joined/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          name: validation-host-routing-attempt-${{ github.run_attempt }}
          path: artifacts/validation/host-routing.json
          if-no-files-found: error
          retention-days: 30
