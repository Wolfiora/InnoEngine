name: Engine CI
run-name: Engine validation ${{ github.sha }}

on:
  pull_request:
  push:
    branches: ['**']
    paths-ignore: ['benchmark/**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      rebuild_backends:
        description: Optional comma-separated platform IDs for a cold rebuild on this manual run
        type: string
      full:
        description: Run complete functional acceptance
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: engine-validation-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      profile: ${{ steps.select.outputs.profile }}
      reason: ${{ steps.select.outputs.reason }}
      pull: ${{ steps.select.outputs.pull }}
      hosts: ${{ steps.select.outputs.hosts }}
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
        run: python -B .github/scripts/routing.py select

  platforms:
    needs: route
    if: needs.route.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.groups) }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    name: ${{ matrix.name }}
    uses: ./.github/workflows/engine-platform.yml
    with:
      hosts: ${{ toJSON(matrix.hosts) }}
      profile: ${{ needs.route.outputs.profile }}
      rebuild_backends: ${{ matrix.rebuild }}

  engine-validation:
    # Branch routing must never publish success under the pull-request merge gate's name.
    name: ${{ github.event_name == 'push' && github.ref_name != github.event.repository.default_branch && 'Branch validation' || 'Engine validation' }}
    # Reconcile failed prerequisites on a live run. A cancelled run has no candidate to certify.
    if: ${{ !cancelled() }}
    needs: [route, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.route.outputs.run == 'true'
        with:
          pattern: validation-{plan,joined,result}-*
          path: artifacts/validation/received
      - name: Reconcile the route and exact required host and shard matrix
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          PLATFORM_RESULT: ${{ needs.platforms.result }}
          SHOULD_RUN: ${{ needs.route.outputs.run }}
          ROUTE_REASON: ${{ needs.route.outputs.reason }}
          ROUTE_PULL: ${{ needs.route.outputs.pull }}
          HOSTS: ${{ needs.route.outputs.hosts }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python -B .github/scripts/validation.py join
      - name: Retain first failures and timing by check category
        if: ${{ !cancelled() && needs.route.outputs.run == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTS: ${{ needs.route.outputs.hosts }}
        run: python -B .github/scripts/validation.py summary
