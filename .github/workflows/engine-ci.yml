name: Engine CI
run-name: Engine validation ${{ inputs.request_id || github.sha }}

on:
  pull_request:
  push:
    branches: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional release completion correlation
        type: string
      source_run:
        description: Successful default-branch run whose missing functional checks should be completed
        type: string
        default: '0'
      full:
        description: Run complete functional acceptance
        type: boolean
        default: true
  workflow_call:
    inputs:
      source_run:
        type: string
        default: '0'
      profile:
        description: Explicit scheduled validation profile
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: engine-validation-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      profile: ${{ steps.select.outputs.profile }}
      hosts: ${{ steps.select.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: select
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          SOURCE_RUN_ID: ${{ inputs.source_run }}
        run: |
          if ($env:REQUESTED_PROFILE) {
            if ($env:REQUESTED_PROFILE -cnotin @('full', 'performance')) { throw 'Unsupported scheduled profile.' }
            $selected = [pscustomobject]@{ run = $true; profile = $env:REQUESTED_PROFILE }
          } else {
            $selected = ./tests/ci/Get-ValidationCadence.ps1 -EventPath $env:GITHUB_EVENT_PATH -Event $env:GITHUB_EVENT_NAME `
              -Commit $env:CANDIDATE -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL | ConvertFrom-Json
          }
          if ($env:SOURCE_RUN_ID -and $env:SOURCE_RUN_ID -cne '0') {
            $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            if ($env:GITHUB_REF_NAME -cne $event.repository.default_branch -or $selected.profile -cne 'full' -or
                $env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Continuation requires a full default-branch candidate and an exact source run.' }
          }
          $hosts = @(Get-Content .github/validation-hosts.json -Raw | ConvertFrom-Json | Where-Object { $selected.profile -cne 'fast' -or $_.fast })
          if ($hosts.Count -eq 0 -or @($hosts.runner | Sort-Object -Unique).Count -ne $hosts.Count) { throw 'Hosted execution registration is empty or duplicated.' }
          # Recheck an ordinary push immediately before scheduling expensive jobs; PR event delivery can race the first lookup.
          if (-not $env:REQUESTED_PROFILE -and $env:GITHUB_EVENT_NAME -ceq 'push' -and $selected.profile -ceq 'fast' -and $selected.run) {
            $selected = ./tests/ci/Get-ValidationCadence.ps1 -EventPath $env:GITHUB_EVENT_PATH -Event $env:GITHUB_EVENT_NAME `
              -Commit $env:CANDIDATE -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL | ConvertFrom-Json
          }
          "run=$($selected.run.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "profile=$($selected.profile)" >> $env:GITHUB_OUTPUT
          "hosts=$(@{ include = $hosts } | ConvertTo-Json -Depth 4 -Compress)" >> $env:GITHUB_OUTPUT

  preflight:
    needs: route
    if: github.event_name == 'schedule' && needs.route.outputs.profile == 'full'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/freeze-validation
        id: freeze
        with:
          profile: ${{ needs.route.outputs.profile }}
      - uses: ./.github/actions/resolve-backends
        id: acquisition
      - name: Preserve the pending plan for a scheduled execution
        shell: pwsh
        run: Copy-Item artifacts/validation/ci-plan/plan.json artifacts/validation/ci-plan/pending.json
      - name: Bind available packages before comparing complete acceptance
        if: steps.acquisition.outputs.production != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $entry = (Get-Content artifacts/validation/ci-plan/entry.json -Raw | ConvertFrom-Json).assembly
          ./tests/ci/Install-BackendAcquisition.ps1 -PlanPath artifacts/validation/ci-plan/plan.json -EntryAssembly $entry `
            -Acquisition artifacts/backend-request/acquisition.json -Downloads artifacts/backend-downloads
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-nightly-plan-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/validation/ci-plan/pending.json
            artifacts/validation/ci-plan/entry.json
            artifacts/validation/bootstrap/outputs/bin/ValidationEntry/debug/
            artifacts/backend-request/acquisition.json
          if-no-files-found: error
          retention-days: 1
      - name: Compare retained complete acceptance after current environment capture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.runner }}
        run: |
          ./tests/ci/Find-ValidationAcceptance.ps1 -PlanDirectory artifacts/validation/ci-plan -Platform $env:PLATFORM `
            -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: validation-preflight-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/validation/ci-plan/
            !artifacts/validation/ci-plan/accepted/**
          if-no-files-found: error
          retention-days: 30

  acceptance-reuse:
    needs: [route, preflight]
    if: github.event_name == 'schedule' && needs.route.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reusable: ${{ steps.join.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: validation-preflight-*
          path: artifacts/validation/received
      - id: join
        shell: pwsh
        env:
          HOSTS: ${{ needs.route.outputs.hosts }}
        run: |
          ./tests/ci/Join-ValidationAcceptance.ps1 -ReceivedDirectory artifacts/validation/received `
            -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner) -ExpectedCommit $env:GITHUB_SHA -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) `
            -OutputPath artifacts/validation/acceptance-reuse.json

  plan:
    needs: [route, preflight, acceptance-reuse]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.route.outputs.run == 'true' && ((needs.preflight.result == 'skipped' && needs.acceptance-reuse.result == 'skipped') || (needs.acceptance-reuse.result == 'success' && needs.acceptance-reuse.outputs.reusable == 'false')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/freeze-validation
        if: needs.preflight.result == 'skipped'
        with:
          profile: ${{ needs.route.outputs.profile }}
      - uses: ./.github/actions/resolve-backends
        if: needs.preflight.result == 'skipped'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.preflight.result == 'success'
        with:
          name: backend-nightly-plan-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: artifacts
      - id: decision
        shell: pwsh
        run: |
          if (Test-Path artifacts/validation/ci-plan/pending.json) {
            Move-Item -LiteralPath artifacts/validation/ci-plan/pending.json -Destination artifacts/validation/ci-plan/plan.json
          }
          $decision = Get-Content artifacts/backend-request/acquisition.json -Raw | ConvertFrom-Json
          "required=$(($decision.packages.Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-request-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: artifacts/backend-request/acquisition.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.decision.outputs.required == 'true'
        with:
          name: backend-freeze-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/validation/ci-plan/plan.json
            artifacts/validation/ci-plan/entry.json
            artifacts/validation/bootstrap/outputs/bin/ValidationEntry/debug/
          if-no-files-found: error
          retention-days: 7
      - name: Bind an independent managed plan on its original runner
        if: steps.decision.outputs.required == 'false'
        shell: pwsh
        run: |
          $entry = (Get-Content artifacts/validation/ci-plan/entry.json -Raw | ConvertFrom-Json).assembly
          ./tests/ci/Install-BackendAcquisition.ps1 -PlanPath artifacts/validation/ci-plan/plan.json -EntryAssembly $entry `
            -Acquisition artifacts/backend-request/acquisition.json -Downloads artifacts/backend-downloads
      - uses: ./.github/actions/execute-validation
        if: steps.decision.outputs.required == 'false'
        with:
          platform: ${{ matrix.runner }}
          source-run: ${{ inputs.source_run || '0' }}

  backend-matrix:
    needs: [route, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.join.outputs.platforms }}
      producers: ${{ steps.join.outputs.producers }}
      deferred: ${{ steps.join.outputs.deferred }}
      required: ${{ steps.join.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: backend-request-*-attempt-${{ github.run_attempt }}
          path: artifacts/requests
      - id: join
        shell: pwsh
        env:
          HOSTS: ${{ needs.route.outputs.hosts }}
        run: |
          $jobs = ./tests/ci/Join-BackendAcquisitions.ps1 -Received artifacts/requests -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner) `
            -Revision $env:GITHUB_SHA -Attempt ([int]$env:GITHUB_RUN_ATTEMPT)
          foreach ($name in 'platforms','producers','deferred') {
            "$name=$(@{include=@($jobs.$name)} | ConvertTo-Json -Compress -Depth 8)" >> $env:GITHUB_OUTPUT
          }
          "required=$(($jobs.platforms.Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  backends:
    needs: backend-matrix
    if: ${{ !cancelled() && needs.backend-matrix.result == 'success' && needs.backend-matrix.outputs.required == 'true' }}
    uses: ./.github/workflows/backend-prebuilts.yml
    with:
      platforms: ${{ needs.backend-matrix.outputs.platforms }}
      producers: ${{ needs.backend-matrix.outputs.producers }}

  execution:
    needs: [backend-matrix, backends]
    if: ${{ !cancelled() && needs.backends.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.backend-matrix.outputs.deferred) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-freeze-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: artifacts/validation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-request-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: artifacts/backend-request
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ${{ matrix.pattern }}
          path: artifacts/candidates
      - name: Bind verified platform archives and the runner SDK
        shell: pwsh
        run: |
          $plan = Get-Content artifacts/validation/ci-plan/plan.json -Raw | ConvertFrom-Json
          if ($plan.commit -cne $env:GITHUB_SHA) { throw 'The transferred plan belongs to a different candidate.' }
          if ($plan.nativeRequests.Count) { $null = ./tests/ci/Initialize-NativeDependencyWorkloads.ps1 -Targets @($plan.nativeRequests.target) }
          $entry = (Get-Content artifacts/validation/ci-plan/entry.json -Raw | ConvertFrom-Json).assembly
          ./tests/ci/Install-BackendAcquisition.ps1 -PlanPath artifacts/validation/ci-plan/plan.json -EntryAssembly $entry `
            -Acquisition artifacts/backend-request/acquisition.json -Downloads artifacts/backend-downloads -Candidates artifacts/candidates
      - uses: ./.github/actions/execute-validation
        with:
          platform: ${{ matrix.runner }}
          source-run: ${{ inputs.source_run || '0' }}

  engine-validation:
    # Branch routing must never publish success under the pull-request merge gate's name.
    name: ${{ github.event_name == 'push' && github.ref_name != github.event.repository.default_branch && 'Branch validation' || 'Engine validation' }}
    if: always()
    needs: [route, preflight, acceptance-reuse, plan, backend-matrix, backends, execution]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.route.outputs.run == 'true'
        with:
          # The gate consumes receipts; compiled archives belong to release continuation.
          pattern: validation-{plan,preflight,joined,result}-*
          path: artifacts/validation/received
      - name: Reconcile the exact required host and shard matrix
        shell: pwsh
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX_RESULT: ${{ needs.backend-matrix.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          BACKENDS_REQUIRED: ${{ needs.backend-matrix.outputs.required }}
          EXECUTION_RESULT: ${{ needs.execution.result }}
          REUSE_RESULT: ${{ needs.acceptance-reuse.result }}
          REUSED: ${{ needs.acceptance-reuse.outputs.reusable }}
          SHOULD_RUN: ${{ needs.route.outputs.run }}
          HOSTS: ${{ needs.route.outputs.hosts }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if ($env:ROUTE_RESULT -cne 'success') { throw 'Event routing did not succeed.' }
          if ($env:SHOULD_RUN -ceq 'false') {
            if ($env:GITHUB_EVENT_NAME -cne 'push') { throw 'A required candidate gate cannot be delegated.' }
            'An open pull request owns this candidate validation.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($env:REUSED -ceq 'true') {
            if ($env:GITHUB_EVENT_NAME -cne 'schedule' -or $env:PREFLIGHT_RESULT -cne 'success' -or $env:REUSE_RESULT -cne 'success') {
              throw 'Only scheduled complete acceptance may reuse authenticated prior certification.'
            }
            ./tests/ci/Join-ValidationAcceptance.ps1 -ReceivedDirectory artifacts/validation/received `
              -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner) -ExpectedCommit $env:EXPECTED_COMMIT -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) `
              -OutputPath artifacts/validation/acceptance-reuse.json
            $decision = Get-Content artifacts/validation/acceptance-reuse.json -Raw | ConvertFrom-Json
            if (-not $decision.reusable) { throw 'The final gate did not receive every matching acceptance proof.' }
            exit 0
          }
          if ($env:SHOULD_RUN -cne 'true' -or $env:PLAN_RESULT -cne 'success' -or $env:MATRIX_RESULT -cne 'success' -or
              ($env:BACKENDS_REQUIRED -ceq 'true' -and ($env:BACKENDS_RESULT -cne 'success' -or $env:EXECUTION_RESULT -cne 'success')) -or
              ($env:BACKENDS_REQUIRED -ceq 'false' -and ($env:BACKENDS_RESULT -cne 'skipped' -or $env:EXECUTION_RESULT -cne 'skipped')) -or
              $env:BACKENDS_REQUIRED -cnotin @('true','false') -or
              ($env:GITHUB_EVENT_NAME -ceq 'schedule' -and $env:PREFLIGHT_RESULT -cne 'skipped' -and $env:REUSE_RESULT -cne 'success')) {
            throw 'One or more required execution jobs did not complete successfully.'
          }
          ./tests/ci/Join-ValidationCi.ps1 -ReceivedDirectory artifacts/validation/received -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner) `
            -ExpectedCommit $env:EXPECTED_COMMIT -Attempt ([int]$env:GITHUB_RUN_ATTEMPT)
      - name: Retain first failures and timing by check category
        if: always() && needs.route.outputs.run == 'true' && needs.acceptance-reuse.outputs.reusable != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HOSTS: ${{ needs.route.outputs.hosts }}
        run: |
          ./tests/ci/Write-ValidationSummary.ps1 -ReceivedDirectory artifacts/validation/received -Repository $env:GITHUB_REPOSITORY `
            -DefaultBranch $env:DEFAULT_BRANCH -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) -RunId ([long]$env:GITHUB_RUN_ID) -ApiUrl $env:GITHUB_API_URL `
            -Hosts (($env:HOSTS | ConvertFrom-Json).include.runner)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.route.outputs.run == 'true' && needs.acceptance-reuse.outputs.reusable != 'true'
        with:
          name: engine-certification-attempt-${{ github.run_attempt }}
          path: artifacts/validation/certification.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.acceptance-reuse.outputs.reusable == 'true'
        with:
          name: engine-acceptance-reuse-attempt-${{ github.run_attempt }}
          path: artifacts/validation/acceptance-reuse.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: env.INNO_FULL_CERTIFICATION == 'true'
        with:
          name: engine-full-certification-attempt-${{ github.run_attempt }}
          path: artifacts/validation/certification.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.route.outputs.run == 'true' && needs.acceptance-reuse.outputs.reusable != 'true'
        with:
          name: engine-acceptance-evidence-attempt-${{ github.run_attempt }}
          path: artifacts/validation/joined/
          if-no-files-found: error
          retention-days: 30

  publish-backends:
    needs: [engine-validation, backend-matrix, backends]
    if: >-
      ${{ !cancelled() && needs.engine-validation.result == 'success' && needs.backends.result == 'success' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      fromJSON(needs.backend-matrix.outputs.producers).include[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: trusted-backend-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '{backend-candidate-*,validation-plan-*,validation-joined-*}'
          path: artifacts/promotion
      - name: Publish certified changes and retain the other platforms byte for byte
        shell: pwsh
        env:
          MATRIX: ${{ needs.backend-matrix.outputs.producers }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:DEFAULT_BRANCH"
          if ($head.object.sha -cne $env:GITHUB_SHA) { Write-Host 'A newer default-branch candidate owns promotion.'; return }
          $producers = @((ConvertFrom-Json $env:MATRIX).include)
          foreach ($item in $producers) {
            $owner = [IO.Directory]::CreateDirectory([IO.Path]::GetFullPath("artifacts/promotion/$($item.target)")).FullName
            $candidate = "artifacts/promotion/backend-candidate-$($item.target)"
            Copy-Item -LiteralPath "$candidate/$($item.asset)","$candidate/consumption.json" -Destination $owner
            Copy-Item -LiteralPath "artifacts/promotion/validation-plan-$($item.runner)-attempt-$env:GITHUB_RUN_ATTEMPT/plan.json" -Destination $owner
            Copy-Item -LiteralPath "artifacts/promotion/validation-joined-$($item.runner)-attempt-$env:GITHUB_RUN_ATTEMPT/results.json" -Destination $owner
          }
          ./tests/ci/Publish-BackendPrebuilts.ps1 -Directory artifacts/promotion -Repository $env:GITHUB_REPOSITORY `
            -Revision $env:GITHUB_SHA -ApiUrl $env:GITHUB_API_URL -ChangedTargets $producers.target
