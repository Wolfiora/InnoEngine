name: Draft verified release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful full Engine CI run on the default branch
        required: true
        type: string
      commit:
        description: Exact 40-character validated source commit
        required: true
        type: string
      tag:
        description: Release tag for the validated source
        required: true
        type: string
      verify_only:
        description: Rehearse all provenance and byte checks without creating a draft
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-verified-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable artifacts and optionally create a draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          ./tests/ci/New-ValidatedDraftRelease.ps1 -RunId ([long]$env:RELEASE_RUN_ID) -Commit $env:RELEASE_COMMIT `
            -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -ApiUrl $env:GITHUB_API_URL `
            -VerifyOnly:($env:VERIFY_ONLY -ceq 'true')
      - name: Retain release verification and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.run_attempt }}
          path: |
            artifacts/release-rehearsal/verified-release.json
            artifacts/release-rehearsal/release-failure.json
          if-no-files-found: warn
          retention-days: 30
