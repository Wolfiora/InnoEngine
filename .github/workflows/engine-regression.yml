name: Engine regression
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  regression:
    # GitHub checks the callee's job permissions before it evaluates publication conditions.
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/engine-ci.yml
    with:
      profile: full
