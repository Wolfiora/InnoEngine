name: Export documentation API
on:
  push:
    branches:
      - master
    paths-ignore: ['benchmark/**']
  pull_request:
    paths:
      - .github/workflows/documentation-api.yml
      - tools/Inno.Tooling.Architecture/Documentation*.cs
      - tools/Inno.Tooling.Documentation/**
      - tests/tools/Inno.Tooling.Architecture.Integration.Tests/Documentation*.cs
      - tests/tools/Inno.Tooling.Documentation.Integration.Tests/**
      - .github/scripts/documentation_artifacts.py
      - .github/scripts/github_artifacts.py
      - tools/Inno.Tooling.Cli/**
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  API_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: documentation-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    name: Plan API export inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.API_SOURCE_REVISION }}
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts
          persist-credentials: false
      - name: Compare the complete input manifest before SDK or submodule preparation
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/documentation_artifacts.py preflight
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-preflight-${{ github.run_attempt }}
          path: artifacts/documentation-export/preflight.json
          retention-days: 30
          if-no-files-found: error
  export:
    name: API facts / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
        configuration:
          - Debug
          - Release
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.API_SOURCE_REVISION }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Restore immutable per-owner extraction candidates
        id: extraction-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/documentation-export/extraction-cache/entries
          key: api-extraction-${{ runner.os }}-${{ matrix.configuration }}-${{ hashFiles('global.json') }}-${{ env.API_SOURCE_REVISION }}
          restore-keys: |
            api-extraction-${{ runner.os }}-${{ matrix.configuration }}-${{ hashFiles('global.json') }}-
      - name: Export actual managed and projected contracts
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          output=artifacts/documentation-export/current
          mkdir -p "$output"
          dotnet run --project tools/Inno.Tooling.Cli -c Release -- docs export-producer . dotnet "$CONFIGURATION" "$output" 2>&1 | tee "$output/producer.log"
      - name: Retain verified extraction payloads for future inputs
        if: success() && steps.extraction-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/documentation-export/extraction-cache/entries
          key: ${{ steps.extraction-cache.outputs.cache-primary-key }}
      - name: Retain completed producer facts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-facts-${{ matrix.os }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: artifacts/documentation-export/current/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain first failures and phase timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-diagnostics-${{ matrix.os }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: artifacts/documentation-export/current/*.log
          if-no-files-found: warn
          retention-days: 30
    needs: preflight
    if: needs.preflight.outputs.required == 'true'
  reconcile:
    name: API export validation
    if: always()
    needs:
      - preflight
      - export
    runs-on: windows-2025
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Reject missing or unsuccessful producers
        shell: bash
        env:
          EXPORT_RESULT: ${{ needs.export.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          REQUIRED: ${{ needs.preflight.outputs.required }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          case "$REQUIRED/$EXPORT_RESULT" in
            true/success) ;;
            false/skipped) echo "NoRelevantChanges" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "API export result is $EXPORT_RESULT, required=$REQUIRED" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.API_SOURCE_REVISION }}
          persist-credentials: false
        if: needs.preflight.outputs.required == 'true'
      - uses: ./.github/actions/setup-dotnet
        if: needs.preflight.outputs.required == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-facts-*-${{ github.run_attempt }}
          path: artifacts/documentation-export/producers
        if: needs.preflight.outputs.required == 'true'
      - name: Reconcile complete exact-source API package
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ env.API_SOURCE_REVISION }}
        run: python -B .github/scripts/documentation_artifacts.py collect
        if: needs.preflight.outputs.required == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-api-package-${{ github.run_attempt }}
          path: artifacts/documentation-export/package/api-package.json
          if-no-files-found: error
          retention-days: 90
        if: needs.preflight.outputs.required == 'true'
  synchronize:
    name: Synchronize Docs draft
    needs:
      - preflight
      - reconcile
    if: github.repository == 'Wolfiora/InnoEngine' && github.ref == 'refs/heads/master' && needs.preflight.outputs.required == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.API_SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: documentation-api-package-${{ github.run_attempt }}
          path: artifacts/documentation-export/package
      - name: Prepare trusted transport before acquiring write credentials
        shell: bash
        run: dotnet build tools/Inno.Tooling.Cli/Inno.Tooling.Cli.csproj --configuration Release
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.INNO_DOCS_APP_ID }}
          private-key: ${{ secrets.INNO_DOCS_APP_PRIVATE_KEY }}
          owner: Wolfiora
          repositories: InnoEngine.Docs
          permission-contents: write
      - name: Atomically update only the persistent draft branch
        shell: bash
        env:
          DOCS_TOKEN: ${{ steps.app.outputs.token }}
        run: python -B .github/scripts/documentation_artifacts.py publish
