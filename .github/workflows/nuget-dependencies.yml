name: NuGet dependency graph

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "**/global.json"
      - "InnoEngine.sln"
      - ".gitmodules"
      - ".github/workflows/nuget-dependencies.yml"
      - ".github/actions/setup-dotnet/**"
  push:
    branches:
      - master
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "**/global.json"
      - "InnoEngine.sln"
      - ".gitmodules"
      - ".github/workflows/nuget-dependencies.yml"
      - ".github/actions/setup-dotnet/**"

permissions:
  contents: read

concurrency:
  group: nuget-dependencies-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  dependencies:
    name: Restore and submit NuGet dependencies
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: InnoEngine
    steps:
      - name: Checkout engine
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          path: InnoEngine
          persist-credentials: false

      - name: Install engine SDK
        uses: ./InnoEngine/.github/actions/setup-dotnet
        with:
          global-json-file: InnoEngine/global.json

      - name: Restore the complete solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'artifacts/acceptance/nuget' | Out-Null
          dotnet restore InnoEngine.sln -p:Configuration=SourceDebug --disable-parallel -nr:false `
            '-bl:artifacts/acceptance/nuget/restore.binlog' 2>&1 |
            Tee-Object -FilePath 'artifacts/acceptance/nuget/restore.log'
          if ($LASTEXITCODE -ne 0) { throw 'The solution dependency restore failed.' }

      - name: Submit resolved NuGet dependencies
        if: github.event_name != 'pull_request'
        uses: actions/component-detection-dependency-submission-action@98beaea5a1227f3db476e4c9ca959a0cacd7ac4f
        with:
          filePath: InnoEngine
          directoryExclusionList: extern
          detectorsCategories: NuGet
          correlator: inno-nuget

      - name: Upload dependency restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-restore-evidence
          path: InnoEngine/artifacts/acceptance/nuget/**
          if-no-files-found: error
