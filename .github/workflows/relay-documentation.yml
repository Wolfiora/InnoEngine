name: Relay documentation evidence

on:
  workflow_run:
    workflows: [Engine CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      engine_run:
        description: Successful Engine CI run with a complete source certificate
        type: string
        required: true
      bootstrap:
        description: Relay the approved migration branch before default-branch cutover
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: documentation-relay-${{ github.event.workflow_run.id || inputs.engine_run }}
  cancel-in-progress: false

jobs:
  relay:
    name: Relay certified source
    if: github.repository == 'Wolfiora/InnoEngine' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || (inputs.bootstrap && github.ref == 'refs/heads/ai-pipeline'))))
    runs-on: windows-2022
    steps:
      # workflow_run uses this protected workflow revision, never the candidate's scripts or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select an eligible certificate before acquiring dispatch access
        id: selection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RUN: ${{ github.event.workflow_run.id || inputs.engine_run }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          $selected = ./tests/ci/Send-DocumentationEvidence.ps1 -RunId $env:ENGINE_RUN -SelectOnly -Bootstrap:($env:BOOTSTRAP -eq 'true')
          "ready=$(($selected.status -ceq 'Ready').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($selected.status -cnotin @('Ready', 'NotApplicable')) { throw 'Evidence selection did not return an explicit decision.' }
          if ($selected.status -ceq 'NotApplicable') { $selected.reason >> $env:GITHUB_STEP_SUMMARY }
      - name: Require the scoped cross-repository dispatch installation
        if: steps.selection.outputs.ready == 'true'
        shell: pwsh
        env:
          APP_ID: ${{ vars.INNO_DOCS_APP_ID }}
          APP_KEY: ${{ secrets.INNO_DOCS_APP_PRIVATE_KEY }}
        run: |
          if (-not $env:APP_ID -or -not $env:APP_KEY) { throw 'Blocked: provision the restricted GitHub App before cross-repository evidence dispatch.' }
      - id: dispatch
        if: steps.selection.outputs.ready == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.INNO_DOCS_APP_ID }}
          private-key: ${{ secrets.INNO_DOCS_APP_PRIVATE_KEY }}
          owner: Wolfiora
          repositories: InnoEngine.Docs
          permission-actions: write
      - name: Reconcile the producer before notifying its independent receiver
        if: steps.selection.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INNO_DOCS_DISPATCH_TOKEN: ${{ steps.dispatch.outputs.token }}
          ENGINE_RUN: ${{ github.event.workflow_run.id || inputs.engine_run }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          ./tests/ci/Send-DocumentationEvidence.ps1 -RunId $env:ENGINE_RUN -Bootstrap:($env:BOOTSTRAP -eq 'true') |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
