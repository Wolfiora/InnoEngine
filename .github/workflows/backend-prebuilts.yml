name: Backend prebuilts
on:
  workflow_call:
    inputs:
      consumers:
        type: string
        required: true
      profile:
        type: string
        required: true
      rebuild_backends:
        type: string
        default: ''
      reader_tags:
        type: string
        required: true
      platforms:
        type: string
        required: true
      builders:
        type: string
        required: true
      producers:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  acquire:
    if: fromJSON(inputs.builders).include[0] != null
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ matrix.operation == 'produce' && '0' || '1' }}
          submodules: ${{ matrix.operation == 'produce' && 'recursive' || 'false' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
        if: matrix.nativeInputs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        if: matrix.sha256 && (matrix.operation == 'produce' || (matrix.operation == 'consume' && matrix.nativeInputs))
        with:
          key: backend-platform-${{ matrix.sha256 }}
          path: artifacts/backend-downloads/${{ matrix.sha256 }}.zip
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.hostSeed.sha256
        with:
          key: backend-platform-${{ matrix.hostSeed.sha256 }}
          path: artifacts/backend-downloads/${{ matrix.hostSeed.sha256 }}.zip
      - name: Acquire the exact prior platform and prepare requested native inputs
        if: matrix.operation == 'produce' || matrix.nativeInputs
        shell: bash
        env:
          SPEC: ${{ toJSON(matrix) }}
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/backend_artifacts.py receive --prepare
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.operation != 'promote' && matrix.sha256 && (matrix.operation == 'produce' || matrix.nativeInputs) && steps.cache.outputs.cache-hit != 'true'
        with:
          key: backend-platform-${{ matrix.sha256 }}
          path: artifacts/backend-downloads/${{ matrix.sha256 }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.operation == 'produce' && matrix.sha256
        with:
          overwrite: true
          name: backend-seed-${{ matrix.target }}
          path: artifacts/backend-input
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.nativeInputs
        with:
          overwrite: true
          name: backend-native-${{ matrix.target }}
          path: |
            artifacts/backend-native/*.zip
            artifacts/backend-native/selection.json
          if-no-files-found: error
          retention-days: 1
  build:
    name: Backend build (${{ matrix.target }})
    needs: acquire
    if: fromJSON(inputs.builders).include[0] != null
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.builders) }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-native-${{ matrix.target }}
          path: artifacts/components/${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.target != matrix.hostTarget
        with:
          name: backend-native-${{ matrix.hostTarget }}
          path: artifacts/components/${{ matrix.hostTarget }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.sha256
        with:
          name: backend-seed-${{ matrix.target }}
          path: artifacts/backend-seed
      - name: Compile changed backend owners and assemble the platform ZIP
        shell: bash
        env:
          SPEC: ${{ toJSON(matrix) }}
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/backend_artifacts.py receive --build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true
          name: backend-candidate-${{ matrix.target }}
          path: artifacts/backend-candidate
          if-no-files-found: error
          retention-days: 7

  execution:
    name: Engine tests (${{ matrix.runner }})
    needs: [acquire, build]
    if: ${{ !cancelled() && ((needs.acquire.result == 'success' && needs.build.result == 'success') || (fromJSON(inputs.builders).include[0] == null && needs.acquire.result == 'skipped' && needs.build.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.consumers) }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - id: freeze
        uses: ./.github/actions/freeze-validation
        with:
          rebuild-backends: ${{ inputs.rebuild_backends }}
          runner-label: ${{ matrix.runner }}
          profile: ${{ inputs.profile }}
          scheduled: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-request-${{ matrix.runner }}
          path: artifacts/backend-request
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.pattern != ''
        with:
          pattern: ${{ matrix.pattern }}
          path: ${{ matrix.destination }}
      - name: Bind verified platform archives and the runner SDK
        shell: bash
        env:
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
          PLATFORMS: ${{ inputs.platforms }}
          REQUIRED_TARGETS: ${{ toJSON(matrix.targets) }}
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/backend_artifacts.py receive --bind
      - name: ${{ steps.freeze.outputs.execution-label }}
        uses: ./.github/actions/execute-validation
        with:
          platform: ${{ matrix.runner }}

      - name: Verify new backend publication inputs
        if: fromJSON(inputs.producers).include[0] != null
        shell: bash
        env:
          PRODUCERS: ${{ inputs.producers }}
          RUNNER_LABEL: ${{ matrix.runner }}
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/backend_artifacts.py publish --verify

  publish-backends:
    name: Publish backend
    needs: execution
    if: >-
      ${{ success() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      fromJSON(inputs.producers).include[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: trusted-backend-publication
      queue: max
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select certified inputs for this producer group
        id: scope
        shell: bash
        env:
          PRODUCERS: ${{ inputs.producers }}
          CONSUMERS: ${{ inputs.consumers }}
        run: python -B .github/scripts/backend_artifacts.py publish --scope

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ${{ steps.scope.outputs.pattern }}
          path: artifacts/promotion
      - name: Publish the certified backend targets
        shell: bash
        env:
          PRODUCERS: ${{ inputs.producers }}
          CONSUMERS: ${{ inputs.consumers }}
          READER_TAGS: ${{ inputs.reader_tags }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/backend_artifacts.py publish
