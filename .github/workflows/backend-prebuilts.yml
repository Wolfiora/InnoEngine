name: Backend prebuilts
on:
  workflow_call:
    inputs:
      consumers:
        type: string
        required: true
      profile:
        type: string
        required: true
      rebuild_backends:
        type: string
        default: ''
      reader_tags:
        type: string
        required: true
      platforms:
        type: string
        required: true
      builders:
        type: string
        required: true
      producers:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  acquire:
    if: fromJSON(inputs.builders).include[0] != null
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ matrix.operation == 'produce' && '0' || '1' }}
          submodules: ${{ matrix.operation == 'produce' && 'recursive' || 'false' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
        if: matrix.nativeInputs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        if: matrix.sha256 && (matrix.operation == 'produce' || (matrix.operation == 'consume' && matrix.nativeInputs))
        with:
          key: backend-platform-${{ matrix.sha256 }}
          path: artifacts/backend-downloads/${{ matrix.sha256 }}.zip
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.hostSeed.sha256
        with:
          key: backend-platform-${{ matrix.hostSeed.sha256 }}
          path: artifacts/backend-downloads/${{ matrix.hostSeed.sha256 }}.zip
      - name: Acquire the exact prior platform and prepare requested native inputs
        if: matrix.operation == 'produce' || matrix.nativeInputs
        shell: bash
        env:
          SPEC: ${{ toJSON(matrix) }}
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/backend_artifacts.py receive --prepare
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.operation != 'promote' && matrix.sha256 && (matrix.operation == 'produce' || matrix.nativeInputs) && steps.cache.outputs.cache-hit != 'true'
        with:
          key: backend-platform-${{ matrix.sha256 }}
          path: artifacts/backend-downloads/${{ matrix.sha256 }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.operation == 'produce' && matrix.sha256
        with:
          overwrite: true
          name: backend-seed-${{ matrix.target }}
          path: artifacts/backend-input
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.nativeInputs
        with:
          overwrite: true
          name: backend-native-${{ matrix.target }}
          path: |
            artifacts/backend-native/*.zip
            artifacts/backend-native/selection.json
          if-no-files-found: error
          retention-days: 1
  build:
    name: Backend build (${{ matrix.target }})
    needs: acquire
    if: fromJSON(inputs.builders).include[0] != null
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.builders) }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-native-${{ matrix.target }}
          path: artifacts/components/${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.target != matrix.hostTarget
        with:
          name: backend-native-${{ matrix.hostTarget }}
          path: artifacts/components/${{ matrix.hostTarget }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.sha256
        with:
          name: backend-seed-${{ matrix.target }}
          path: artifacts/backend-seed
      - name: Compile changed backend owners and assemble the platform ZIP
        shell: pwsh
        env:
          SPEC: ${{ toJSON(matrix) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $item = $env:SPEC | ConvertFrom-Json
          $null = ./tools/ci/Initialize-NativeDependencyWorkloads.ps1 -Targets @($item.target)
          $entry = @(./tools/ci/Initialize-ValidationEntry.ps1 -Dotnet (Get-Command dotnet).Source -LogPath artifacts/components/bootstrap.log)
          $native = [ordered]@{layout='platform-packages';assets=@();aggregates=@()}
          foreach ($component in Get-ChildItem artifacts/components -Directory) {
            $source = Get-Content -LiteralPath (Join-Path $component.FullName 'selection.json') -Raw | ConvertFrom-Json -AsHashtable -Depth 80
            $store = [IO.Directory]::CreateDirectory((Join-Path $component.FullName 'native')).FullName
            foreach ($family in @('assets','aggregates')) {
              foreach ($asset in $source[$family]) {
                if ($asset.target -cne $component.Name -or $asset.sha256 -cnotmatch '^[a-f0-9]{64}$' -or $asset.asset -cnotmatch '^[A-Za-z0-9._-]+\.zip$') {
                  throw 'Invalid native input receipt.'
                }
                $dest = Join-Path $store "$($asset.sha256).zip"
                if (!(Test-Path -LiteralPath $dest)) {
                  $src = Join-Path $component.FullName $asset.asset
                  if ((Get-FileHash -LiteralPath $src).Hash.ToLowerInvariant() -cne $asset.sha256) { throw 'Native input changed during transfer.' }
                  New-Item -ItemType HardLink -Path $dest -Target $src | Out-Null
                }
              }
              $native[$family] += @($source[$family])
            }
          }
          [IO.File]::WriteAllText([IO.Path]::GetFullPath('artifacts/components/selection.json'), (ConvertTo-Json $native -Compress -Depth 80))
          $seed = if ($item.sha256) { Join-Path 'artifacts/backend-seed' $item.asset }
          ./tools/ci/Build-BackendPrebuilt.ps1 -Target $item.target -HostTarget $item.hostTarget -EntryAssembly $entry[0] `
            -NativeSelection "artifacts/components/$($item.target)/selection.json" -ConsumptionSelection artifacts/components/selection.json `
            -PreviousPackage $seed -PreviousSha256 $item.sha256 -PreviousTag $item.tag -WorkspaceDirectory artifacts/bp -OutputDirectory artifacts/backend-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true
          name: backend-candidate-${{ matrix.target }}
          path: artifacts/backend-candidate
          if-no-files-found: error
          retention-days: 7

  execution:
    name: Engine tests (${{ matrix.runner }})
    needs: [acquire, build]
    if: ${{ !cancelled() && ((needs.acquire.result == 'success' && needs.build.result == 'success') || (fromJSON(inputs.builders).include[0] == null && needs.acquire.result == 'skipped' && needs.build.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.consumers) }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - id: freeze
        uses: ./.github/actions/freeze-validation
        with:
          rebuild-backends: ${{ inputs.rebuild_backends }}
          runner-label: ${{ matrix.runner }}
          profile: ${{ inputs.profile }}
          scheduled: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-request-${{ matrix.runner }}
          path: artifacts/backend-request
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.pattern != ''
        with:
          pattern: ${{ matrix.pattern }}
          path: ${{ matrix.destination }}
      - name: Bind verified platform archives and the runner SDK
        shell: bash
        env:
          REBUILD_TARGETS: ${{ inputs.rebuild_backends }}
          PLATFORMS: ${{ inputs.platforms }}
          REQUIRED_TARGETS: ${{ toJSON(matrix.targets) }}
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/backend_artifacts.py receive --bind
      - name: ${{ steps.freeze.outputs.execution-label }}
        uses: ./.github/actions/execute-validation
        with:
          platform: ${{ matrix.runner }}

      - name: Verify new backend publication inputs
        if: fromJSON(inputs.producers).include[0] != null
        shell: pwsh
        env:
          PRODUCERS: ${{ inputs.producers }}
          RUNNER_LABEL: ${{ matrix.runner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $local = @(($env:PRODUCERS | ConvertFrom-Json).include | Where-Object runner -CEQ $env:RUNNER_LABEL)
          if (!$local.Count) { return }
          foreach ($item in $local) {
            $candidate = "artifacts/candidates/backend-candidate-$($item.target)"
            $owner = [IO.Directory]::CreateDirectory([IO.Path]::GetFullPath("artifacts/verified/$($item.target)"))
            Copy-Item -LiteralPath "$candidate/$($item.asset)", "$candidate/consumption.json", 'artifacts/validation/ci-plan/plan.json', 'artifacts/validation/host-certification/results.json' -Destination $owner
          }
          ./tools/ci/Publish-BackendPrebuilts.ps1 -VerifyOnly -Directory artifacts/verified -Repository $env:GITHUB_REPOSITORY -Revision $env:GITHUB_SHA -ChangedTargets $local.target -Promoted @($local | Where-Object operation -CEQ promote)

  publish-backends:
    name: Publish backend
    needs: execution
    if: >-
      ${{ success() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      fromJSON(inputs.producers).include[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: trusted-backend-publication
      queue: max
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select certified inputs for this producer group
        id: scope
        shell: pwsh
        env:
          PRODUCERS: ${{ inputs.producers }}
          CONSUMERS: ${{ inputs.consumers }}
        run: |
          $patterns = @(foreach ($item in (($env:PRODUCERS | ConvertFrom-Json).include | Where-Object operation -CEQ produce)) { "backend-candidate-$($item.target)" })
          foreach ($consumer in ($env:CONSUMERS | ConvertFrom-Json).include) {
            $patterns += "validation-{plan,joined,result}-$($consumer.runner)-*"
          }
          $pattern = if ($patterns.Count -eq 1) { $patterns[0] } else { "{$($patterns -join ',')}" }
          "pattern=$pattern" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ${{ steps.scope.outputs.pattern }}
          path: artifacts/promotion
      - name: Publish the certified backend targets
        shell: pwsh
        env:
          PRODUCERS: ${{ inputs.producers }}
          CONSUMERS: ${{ inputs.consumers }}
          READER_TAGS: ${{ inputs.reader_tags }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $producers = ($env:PRODUCERS | ConvertFrom-Json).include
          $consumers = ($env:CONSUMERS | ConvertFrom-Json).include
          ./tools/ci/Join-ValidationCi.ps1 -ReceivedDirectory artifacts/promotion -Hosts $consumers.runner -ExpectedCommit $env:GITHUB_SHA `
            -Attempt ([int]$env:GITHUB_RUN_ATTEMPT)
          $promoted = @($producers | Where-Object operation -CEQ promote)
          foreach ($item in $promoted) { $null = ($item | ConvertTo-Json -Depth 20 -Compress) | python -B .github/scripts/backend_artifacts.py receive --directory artifacts/promotion }
          foreach ($item in $producers) {
            $owner = [IO.Directory]::CreateDirectory([IO.Path]::GetFullPath("artifacts/promotion/$($item.target)")).FullName
            $candidate = "artifacts/promotion/backend-candidate-$($item.target)"
            Copy-Item -LiteralPath "$candidate/$($item.asset)","$candidate/consumption.json" -Destination $owner
            $evidence = "artifacts/validation/joined/$($item.runner)"
            Copy-Item -LiteralPath "$evidence/plan.json","$evidence/results.json" -Destination $owner
          }
          $head = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:DEFAULT_BRANCH"
          if ($head.object.sha -cne $env:GITHUB_SHA) { Write-Host 'A newer default-branch candidate owns promotion.'; return }
          ./tools/ci/Publish-BackendPrebuilts.ps1 -Directory artifacts/promotion -Repository $env:GITHUB_REPOSITORY `
            -Revision $env:GITHUB_SHA -ApiUrl $env:GITHUB_API_URL -ChangedTargets $producers.target -Promoted $promoted -ActiveTags (ConvertFrom-Json -NoEnumerate $env:READER_TAGS)
