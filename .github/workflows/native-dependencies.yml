name: Native dependencies
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Source revision to produce and verify
        required: true
        default: master
        type: string
      targets:
        description: Comma-separated registered targets; empty selects every hosted target
        default: ''
        type: string
      products:
        description: Comma-separated declared product closures; empty selects the target contribution's products
        default: ''
        type: string
      configurations:
        description: Requested configurations intersect each target's registered production matrix; partial refresh requires matching existing selections
        default: Debug,Release
        type: string
      force_cold:
        description: Build from fresh native owners without restoring producer candidates
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: native-dependencies-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      release: ${{ steps.select.outputs.release }}
      hosts: ${{ steps.select.outputs.hosts }}
      acceptance: ${{ steps.select.outputs.acceptance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - id: select
        shell: pwsh
        env:
          TARGETS: ${{ inputs.targets }}
          CONFIGURATIONS: ${{ inputs.configurations }}
        run: |
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[a-f0-9]{40}$') { throw 'Producer revision is not exact.' }
          $registered = @(Get-Content .github/native-targets.json -Raw | ConvertFrom-Json)
          if ($registered.Count -eq 0 -or @($registered.target | Sort-Object -Unique).Count -ne $registered.Count) { throw 'Native target registration is empty or duplicated.' }
          $targets = @($env:TARGETS.Split(',', [StringSplitOptions]::TrimEntries -bor [StringSplitOptions]::RemoveEmptyEntries))
          if ($targets.Count -eq 0) { $targets = @($registered.target) }
          if (@($targets | Sort-Object -Unique).Count -ne $targets.Count -or @($targets | Where-Object { $_ -cnotin $registered.target }).Count -ne 0) { throw 'Select unique registered producer targets.' }
          $requested = @($env:CONFIGURATIONS.Split(',', [StringSplitOptions]::TrimEntries -bor [StringSplitOptions]::RemoveEmptyEntries))
          if ($requested.Count -eq 0 -or @($requested | Sort-Object -Unique).Count -ne $requested.Count -or
              @($requested | Where-Object { $_ -cnotin @('Debug', 'Release') }).Count -ne 0) { throw 'Select unique Debug/Release configurations.' }
          $hosts = @($registered | Where-Object { $_.target -cin $targets } | ForEach-Object {
            $registration = $_
            $configured = @($registration.configurations)
            if ($configured.Count -eq 0 -or @($configured | Sort-Object -Unique).Count -ne $configured.Count -or
                @($configured | Where-Object { $_ -cnotin @('Debug', 'Release') }).Count -ne 0) { throw 'A producer target has no valid configuration matrix.' }
            $selected = @($configured | Where-Object { $_ -cin $requested })
            if ($selected.Count -eq 0) { throw "No requested configuration is registered for $($registration.target)." }
            [pscustomobject]@{ target = $registration.target; runner = $registration.runner; workloads = @($registration.workloads); configurations = $selected }
          })
          $acceptance = @(Get-Content .github/validation-hosts.json -Raw | ConvertFrom-Json | Where-Object { $_.runner -cin $hosts.runner })
          if (@($hosts.runner | Sort-Object -Unique).Count -ne $acceptance.Count) { throw 'Every selected target requires a registered acceptance host.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "release=native-deps-$commit-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "hosts=$(@{ include = $hosts } | ConvertTo-Json -Depth 6 -Compress)" >> $env:GITHUB_OUTPUT
          "acceptance=$(@{ include = $acceptance } | ConvertTo-Json -Depth 6 -Compress)" >> $env:GITHUB_OUTPUT
  produce:
    needs: select
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Prepare the managed Build entry
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VALIDATION_PLATFORM: ${{ matrix.runner }}
        run: |
          $null = ./tests/ci/Initialize-NativeDependencyWorkloads.ps1 -Targets @($env:TARGET)
          $hostTarget = @(Get-Content .github/validation-hosts.json -Raw | ConvertFrom-Json | Where-Object runner -CEQ $env:VALIDATION_PLATFORM)
          if ($hostTarget.Count -ne 1) { throw 'The producer requires one explicit registered host tools target.' }
          "NATIVE_TOOLS_TARGET=$($hostTarget[0].target)" >> $env:GITHUB_ENV
          $entryOwner = [IO.Path]::GetFullPath('artifacts/validation/native-entry', $env:GITHUB_WORKSPACE)
          dotnet build entry/InnoEngine.Build/InnoEngine.Build.csproj --configuration Debug --artifacts-path $entryOwner --disable-build-servers -m:2 -nr:false
          if ($LASTEXITCODE -ne 0) { throw 'Build entry preparation failed.' }
          $entry = @(dotnet msbuild entry/InnoEngine.Build/InnoEngine.Build.csproj -nologo -p:Configuration=Debug "-p:ArtifactsPath=$entryOwner" -getProperty:TargetPath)
          if ($LASTEXITCODE -ne 0 -or $entry.Count -ne 1 -or -not (Test-Path -LiteralPath $entry[0] -PathType Leaf)) { throw 'Build entry discovery failed.' }
          "NATIVE_ENTRY=$($entry[0])" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ !inputs.force_cold }}
        with:
          key: native-producer-${{ matrix.target }}-${{ hashFiles('global.json') }}-${{ github.run_id }}
          restore-keys: native-producer-${{ matrix.target }}-${{ hashFiles('global.json') }}-
          path: artifacts/dependencies/producer-cache.zip
      - name: Produce exact product closures and verify binding generation
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RELEASE: ${{ needs.select.outputs.release }}
          PRODUCER_REVISION: ${{ needs.select.outputs.commit }}
          FORCE_COLD: ${{ inputs.force_cold }}
          PRODUCTS: ${{ inputs.products }}
          CONFIGURATIONS: ${{ join(matrix.configurations, ',') }}
        run: |
          $exports = 'artifacts/dependencies/export'
          New-Item -ItemType Directory -Path $exports -Force | Out-Null
          if ($env:FORCE_COLD -cne 'true' -and (Test-Path artifacts/dependencies/producer-cache.zip)) {
            dotnet $env:NATIVE_ENTRY native-dependencies --tools-target $env:NATIVE_TOOLS_TARGET --operation import-cache --input artifacts/dependencies/producer-cache.zip
            if ($LASTEXITCODE -ne 0) { throw 'Producer cache import failed; preserve the first failure.' }
          }
          $products = @($env:PRODUCTS.Split(',', [StringSplitOptions]::TrimEntries -bor [StringSplitOptions]::RemoveEmptyEntries))
          dotnet $env:NATIVE_ENTRY native-dependencies --tools-target $env:NATIVE_TOOLS_TARGET --operation describe --target $env:TARGET --output artifacts/dependencies/products.json
          if ($LASTEXITCODE -ne 0) { throw 'The selected native target has no declared product contribution.' }
          $declared = Get-Content artifacts/dependencies/products.json -Raw | ConvertFrom-Json
          if ($declared.target -cne $env:TARGET) { throw 'Native product discovery returned another target.' }
          if ($products.Count -eq 0) { $products = @($declared.products) }
          $configurations = @($env:CONFIGURATIONS.Split(',', [StringSplitOptions]::TrimEntries -bor [StringSplitOptions]::RemoveEmptyEntries))
          if ($products.Count -eq 0 -or @($products | Where-Object { $_ -cnotin $declared.products }).Count -ne 0 -or
              @($products | Sort-Object -Unique).Count -ne $products.Count -or
              $configurations.Count -eq 0 -or @($configurations | Where-Object { $_ -cnotin @('Debug', 'Release') }).Count -ne 0 -or
              @($configurations | Sort-Object -Unique).Count -ne $configurations.Count) { throw 'Select unique declared products and Debug/Release configurations.' }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          foreach ($configuration in $configurations) {
            ./tests/ci/Invoke-NativeDependenciesCi.ps1 -Operation Produce -EntryAssembly $env:NATIVE_ENTRY -ToolsTarget $env:NATIVE_TOOLS_TARGET -Target $env:TARGET `
              -Products $products -Configuration $configuration -Release $env:RELEASE -OutputDirectory $exports
            foreach ($product in $products) {
              dotnet $env:NATIVE_ENTRY native-dependencies --tools-target $env:NATIVE_TOOLS_TARGET --operation verify-bindings --target $env:TARGET --product $product --configuration $configuration
              if ($LASTEXITCODE -ne 0) { throw 'Producer binding correctness failed.' }
            }
          }
          $fragments = @(Get-ChildItem -LiteralPath $exports -File -Filter '*.json' | ForEach-Object FullName)
          ./tests/ci/Merge-NativeDependencySelection.ps1 -Fragments $fragments -OutputPath "$exports/native-artifacts.json" `
            -ProducerRevision $env:PRODUCER_REVISION -Release $env:RELEASE
          @{ target = $env:TARGET; products = $products; configurations = $configurations; seconds = $clock.Elapsed.TotalSeconds; cold = $env:FORCE_COLD -ceq 'true' } |
            ConvertTo-Json | Set-Content "$exports/production-timing.json"
      - name: Retain producer candidates under their original owners
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RELEASE: ${{ needs.select.outputs.release }}
          PRODUCER_REVISION: ${{ needs.select.outputs.commit }}
          VALIDATION_PLATFORM: ${{ matrix.runner }}
        run: |
          $hostTarget = @(Get-Content .github/validation-hosts.json -Raw | ConvertFrom-Json | Where-Object runner -CEQ $env:VALIDATION_PLATFORM)
          if ($hostTarget.Count -ne 1) { throw 'The producer has no unique host registration.' }
          if ($env:TARGET -ceq $hostTarget[0].target) {
            dotnet $env:NATIVE_ENTRY validate run --engine-root $env:GITHUB_WORKSPACE --dotnet (Get-Command dotnet).Source `
              --profile native-producer --output artifacts/validation/native-producer-cost
            if ($LASTEXITCODE -ne 0) { throw 'Declared producer regressions failed.' }
          }
          dotnet $env:NATIVE_ENTRY native-dependencies --tools-target $env:NATIVE_TOOLS_TARGET --operation export-cache --output artifacts/dependencies/producer-cache.zip
          if ($LASTEXITCODE -ne 0) { throw 'Producer cache export failed.' }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: native-producer-${{ matrix.target }}-${{ hashFiles('global.json') }}-${{ github.run_id }}
          path: artifacts/dependencies/producer-cache.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-dependency-${{ matrix.target }}
          path: artifacts/dependencies/export/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-producer-cost-${{ matrix.target }}
          path: artifacts/validation/native-producer-cost/
          if-no-files-found: warn
          retention-days: 30
  certify:
    needs: [select, produce]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.acceptance) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-dependency-*
          path: artifacts/dependencies/received
      - name: Certify actual consumption after all selected targets are available
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MATRIX: ${{ needs.select.outputs.hosts }}
          VALIDATION_PLATFORM: ${{ matrix.runner }}
          PRODUCER_REVISION: ${{ needs.select.outputs.commit }}
          RELEASE: ${{ needs.select.outputs.release }}
        run: |
          ./tests/ci/Certify-NativeDependencies.ps1 -Directory artifacts/dependencies/received -Targets (($env:TARGET_MATRIX | ConvertFrom-Json).include) `
            -Platform $env:VALIDATION_PLATFORM -ProducerRevision $env:PRODUCER_REVISION -Release $env:RELEASE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-certification-${{ matrix.runner }}
          path: artifacts/dependencies/certification/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-consumption-evidence-${{ matrix.runner }}
          path: artifacts/validation/native-consumption/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: [select, certify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: artifacts/dependencies/received
      - name: Publish a new immutable dependency release after complete acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_REVISION: ${{ needs.select.outputs.commit }}
          RELEASE: ${{ needs.select.outputs.release }}
          HOSTS: ${{ needs.select.outputs.hosts }}
        run: |
          ./tests/ci/Publish-NativeDependencies.ps1 -Directory artifacts/dependencies/received -Repository $env:GITHUB_REPOSITORY `
            -ApiUrl $env:GITHUB_API_URL -ProducerRevision $env:PRODUCER_REVISION -Release $env:RELEASE -Targets (($env:HOSTS | ConvertFrom-Json).include.target)
