name: Retain validation evidence
description: Upload one executed shard's diagnostics and its eligible release outputs.
inputs:
  platform:
    required: true
    description: Registered runner.
  shard:
    required: true
    description: Frozen execution shard.
  directory:
    required: true
    description: Owned directory containing this shard's receipt and diagnostics.
  compiled:
    default: ''
    description: Verified compiled outputs for release continuation.
  deliverables:
    default: ''
    description: Verified package directory.
runs:
  using: composite
  steps:
    - name: Preserve compiled output bytes and executable modes
      if: github.ref_name == github.event.repository.default_branch && inputs.compiled != ''
      shell: pwsh
      env:
        COMPILED_OUTPUTS: ${{ inputs.compiled }}
        OUTPUT_ARCHIVE: artifacts/validation/outputs-${{ inputs.shard }}.tar
      run: ./tools/ci/Transfer-ValidationOutputs.ps1 -Operation Pack -Directory $env:COMPILED_OUTPUTS -Archive $env:OUTPUT_ARCHIVE
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: github.ref_name == github.event.repository.default_branch && inputs.compiled != ''
      with:
        name: validation-outputs-${{ inputs.platform }}-${{ inputs.shard }}-attempt-${{ github.run_attempt }}
        path: artifacts/validation/outputs-${{ inputs.shard }}.tar
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: validation-result-${{ inputs.platform }}-${{ inputs.shard }}-attempt-${{ github.run_attempt }}
        path: ${{ inputs.directory }}/results.json
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: validation-diagnostics-${{ inputs.platform }}-${{ inputs.shard }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ inputs.directory }}/
          !${{ inputs.directory }}/accepted/**
          !${{ inputs.directory }}/results.json
        if-no-files-found: warn
        retention-days: 30
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: inputs.deliverables != ''
      with:
        name: deliverable-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: ${{ inputs.deliverables }}/
        if-no-files-found: error
        retention-days: 90
