name: Retain validation evidence
description: Upload one executed shard's diagnostics.
inputs:
  platform:
    required: true
    description: Registered runner.
  shard:
    required: true
    description: Frozen execution shard.
  directory:
    required: true
    description: Owned directory containing this shard's receipt and diagnostics.
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: validation-result-${{ inputs.platform }}-${{ inputs.shard }}-attempt-${{ github.run_attempt }}
        path: ${{ inputs.directory }}/results.json
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: validation-diagnostics-${{ inputs.platform }}-${{ inputs.shard }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ inputs.directory }}/**/*.trx
          ${{ inputs.directory }}/**/*.log
          ${{ inputs.directory }}/**/execution-summary.json
        if-no-files-found: warn
        retention-days: 30
