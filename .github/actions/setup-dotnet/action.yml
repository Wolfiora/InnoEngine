name: Install repository .NET SDK
description: Install the declared SDK baseline into an isolated runner directory.

inputs:
  global-json-file:
    description: SDK declaration relative to the workflow workspace.
    required: false
    default: global.json

outputs:
  dotnet-version:
    description: SDK version installed by the official setup action.
    value: ${{ steps.install.outputs.dotnet-version }}

runs:
  using: composite
  steps:
    - name: Install declared SDK
      id: install
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/inno-dotnet
      with:
        global-json-file: ${{ inputs.global-json-file }}

    - name: Verify selected SDK
      shell: bash
      env:
        SDK_DECLARATION: ${{ inputs.global-json-file }}
      run: |
        expected=$(python -c 'import json, os; print(json.load(open(os.environ["SDK_DECLARATION"], encoding="utf-8"))["sdk"]["version"])')
        actual=$(dotnet --version)
        if [[ "$actual" != "$expected" ]]; then
          echo "Expected SDK $expected, got $actual" >&2
          exit 1
        fi
