name: Execute validation
description: Run the bound host plan and retain its exact receipts and release outputs.
inputs:
  platform:
    required: true
    description: Registered runner label.
  source-run:
    default: '0'
    description: Default branch continuation run.
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: validation-plan-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: |
          artifacts/validation/ci-plan/plan.json
          artifacts/validation/ci-plan/entry.json
        if-no-files-found: error
        retention-days: 30
    - name: Execute the frozen shards
      id: workers
      shell: pwsh
      env:
        VALIDATION_PLATFORM: ${{ inputs.platform }}
        SOURCE_RUN_ID: ${{ inputs.source-run || '0' }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if ($env:GITHUB_EVENT_NAME -ceq 'schedule' -and $env:SOURCE_RUN_ID -ceq '0') {
          $request = Get-Content artifacts/backend-request/acquisition.json -Raw | ConvertFrom-Json
          if ($request.continuationRun) { $env:SOURCE_RUN_ID = [string]$request.continuationRun }
        }
        ./tools/ci/Invoke-ValidationWorkers.ps1 -Platform $env:VALIDATION_PLATFORM -ExpectedCommit $env:GITHUB_SHA `
        -WorkerDirectory (Join-Path $env:RUNNER_TEMP 'inno-shards') -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) -SourceRunId ([long]$env:SOURCE_RUN_ID)
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: validation-joined-${{ inputs.platform }}-attempt-${{ github.run_attempt }}
        path: |
          artifacts/validation/host-certification/results.json
          artifacts/validation/host-certification/receipt.json
        if-no-files-found: error
        retention-days: 30
    - name: Retain reusable backend test results for this execution environment
      id: backend-tests
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      shell: pwsh
      run: |
        $plan = Get-Content artifacts/validation/ci-plan/plan.json -Raw | ConvertFrom-Json -AsHashtable -Depth 100
        $ids = @($plan.checks | Where-Object { $_.kind -ceq 'test' -and $_.owner.StartsWith('tests/backends/') -and $_.reusable -and !$_.exclusion } | ForEach-Object id)
        if (!$ids.Count) { return }
        $joined = Get-Content artifacts/validation/host-certification/results.json -Raw | ConvertFrom-Json -AsHashtable -Depth 40
        $tests = @($joined.results | Where-Object { $_.id -cin $ids -and $_.status -cin @('Passed','Reused') })
        if ($joined.version -ne 2 -or $joined.failures -isnot [array] -or $joined.failures.Count -or !$joined.completed -or $tests.Count -ne $ids.Count -or $joined.environment -cne $plan.environment) { throw 'Backend test certification is incomplete.' }
        $proof = @{version=$joined.version;commit=$plan.commit;environment=$plan.environment;hostTarget=$plan.backendHost;attempt=[int]$env:GITHUB_RUN_ATTEMPT;tests=$tests}
        [IO.File]::WriteAllText([IO.Path]::GetFullPath('artifacts/validation/backend-tests.json'), (ConvertTo-Json $proof -Depth 25 -Compress))
        "name=backend-tests-$($plan.backendHost)-$($plan.environment)" >> $env:GITHUB_OUTPUT
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: steps.backend-tests.outputs.name
      with:
        name: ${{ steps.backend-tests.outputs.name }}
        path: artifacts/validation/backend-tests.json
        if-no-files-found: error
        overwrite: true
        retention-days: 30
    - uses: ./.github/actions/retain-validation
      if: always() && steps.workers.outputs.architecture_directory != ''
      with:
        platform: ${{ inputs.platform }}
        shard: architecture
        directory: ${{ steps.workers.outputs.architecture_directory }}
        compiled: ${{ steps.workers.outputs.architecture_compiledOutputs }}
        deliverables: ${{ steps.workers.outputs.architecture_deliverables }}
    - uses: ./.github/actions/retain-validation
      if: always() && steps.workers.outputs.managed_directory != ''
      with:
        platform: ${{ inputs.platform }}
        shard: managed
        directory: ${{ steps.workers.outputs.managed_directory }}
        compiled: ${{ steps.workers.outputs.managed_compiledOutputs }}
        deliverables: ${{ steps.workers.outputs.managed_deliverables }}
    - uses: ./.github/actions/retain-validation
      if: always() && steps.workers.outputs.native_directory != ''
      with:
        platform: ${{ inputs.platform }}
        shard: native
        directory: ${{ steps.workers.outputs.native_directory }}
        compiled: ${{ steps.workers.outputs.native_compiledOutputs }}
        deliverables: ${{ steps.workers.outputs.native_deliverables }}
