name: Freeze validation plan
description: Resolve affected owners and environment inputs on the execution host.
inputs:
  runner-label:
    description: Registered validation runner.
    required: true
  rebuild-backends:
    description: Explicit backend targets requested by a manual run.
    default: ''
  scheduled:
    description: Bind the plan and validation entry from this run on its final runner.
    default: 'false'
  profile:
    required: true
    description: Validation depth chosen by event routing.
outputs:
  execution-label:
    value: ${{ steps.freeze.outputs.execution_label }}
    description: Work selected for this host.
  native:
    value: ${{ steps.freeze.outputs.native }}
    description: Whether this host requires native packages.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: inputs.scheduled == 'true'
      with:
        name: scheduled-plan-${{ inputs.runner-label }}
        path: artifacts/validation
    - name: Freeze candidate, actual inputs, checks and shard ownership
      id: freeze
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PLATFORM: ${{ inputs.runner-label }}
        REBUILD_BACKENDS: ${{ inputs.rebuild-backends }}
        BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        EXPECTED_COMMIT: ${{ github.sha }}
        SCHEDULED: ${{ inputs.scheduled }}
        PROFILE: ${{ inputs.profile }}
      run: python -B .github/scripts/validation.py plan
